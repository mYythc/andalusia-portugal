ra del Darro 是阿尔罕布拉宫山脚的一条古老街道。河流、石桥和山坡建筑共同构成格拉纳达最有层次的街景。","顺着河走，注意两岸地形和街道为什么这么窄：城市很早就沿着河谷与陡峭坡地发展。抬头能看到阿宫塔楼和城墙。","不必只盯着远处宫殿，也看看街道入口的石桥、旧门窗以及河道沿线的建筑材料。","走到悲伤大道后，可以从低处仰看宫殿，再上阿尔拜辛形成完整的视角变化。"],["悲伤大道","位于阿尔罕布拉宫山脚的广场和步道，名字与历史上的送葬路线有关。","先观察整体位置和建筑／街道的空间关系，再沿主要步行方向慢慢进入。这一站的重点是理解它在城市中的作用，而不只是拍下地标外观。","站在广场向上看阿宫，换一个低角度观察城墙和塔楼。","如果时间有限，选择最有代表性的视角停留即可；可结合前后一站比较不同年代的城市风貌。"],["阿尔拜辛","阿尔拜辛是格拉纳达历史悠久的山坡街区，中世纪伊斯兰城市的道路肌理在这里保留得较为明显。白墙、狭窄街巷和庭院围墙，使公共街道与家庭内部生活保持区分。","沿 Cuesta del Chapiz 上坡时，可以观察街道怎样顺应地形弯曲。许多传统住宅有内向的庭院，不容易从街上看到内部。","这片街区与对面的阿尔罕布拉宫共同构成世界遗产的城市景观。前者更像普通居民的城市，后者则是王室与权力中心。","如果已走累，保留圣尼古拉斯观景台即可，没有必要钻遍所有小巷。"],["圣尼古拉斯观景台","这里隔着达罗河谷正对阿尔罕布拉宫，是从城市生活一侧观看王宫最经典的位置。远处常可见内华达山脉。","先找到阿宫的长条城墙，再从左向右辨认塔楼与建筑群。夕阳时石墙会变暖，太阳落下后又逐渐偏蓝灰色。","从这里能清楚感受到阿宫为何能控制山谷和城镇：它坐落在与阿尔拜辛相对的高地上。","日落时人很多，注意个人物品；这里是公共观景平台，无需门票。"],["圣胡安德迪奥斯","你面前这座金色教堂建于1737—1759年，属于圣若望·天主创立的仁爱修会（Hospitaller Order）。圣若望·天主以照料穷人和病人为事业，因此教堂宏丽的主题并不只是展示财富，也在表达仁爱与慈善。","进门先站在中轴线上看整座拉丁十字形空间：层叠的镀金祭坛、绘画、雕塑和彩色光线同时汇聚到主祭坛。接着抬头看交叉部上方的穹顶，寻找天使、圣徒和象征性的人物。","主祭坛深处的圣物空间与圣若望·天主有关。这里的巴洛克手法故意让人感觉“满、亮、动”：雕像伸向空间，金饰覆盖建筑表面，绘画仿佛突破真实天花板。试着站远一点看整体，再靠近看叶饰与人物表情。","与下午的纳斯瑞德宫形成对照：这里通过金色、雕塑与戏剧性的光线打动参观者；纳斯瑞德宫则更多借水面、书法、几何和阴影制造宁静与秩序。院方对部分圣物区域可能另有参观规定，遵守现场指引。"],["金色教堂","这座教堂建于1737—1759年，纪念以照顾病人和贫困者闻名的圣若望·天主。它属于西班牙巴洛克的高装饰风格，金色并非单纯炫耀，而是用视觉上的辉煌表达宗教信仰。","从入口沿中轴线往前走，先整体看主祭坛和穹顶，再逐一观察侧礼拜堂。墙上的绘画、雕塑与金色祭坛像连续的舞台布景，让视线不断向上、向内移动。","留意交叉部上方穹顶的画面和教堂深处与圣人遗物有关的空间。把视线从天花板落到地面，你会发现整座建筑刻意制造强烈的明暗与层次。","现场慢看30–50分钟通常比快速拍完照更有收获。可与附近圣赫罗尼莫修道院较克制的文艺复兴空间作对比。"],["圣赫罗尼莫修道院","这座修道院由天主教双王支持兴建，反映1492年格拉纳达被基督教王国征服后城市宗教与政治中心的变化。它是早期西班牙文艺复兴建筑的重要例子。","先看回廊：柱列、拱廊、花园形成安静、规整的几何空间。然后进教堂，观察拉丁十字形布局以及两侧较为简洁的石质结构。","最值得停下的是主祭坛——众多圣徒、英雄、天使及历史人物的雕塑和图像组成复杂叙事。西班牙军事人物“伟大队长”贡萨洛·费尔南德斯·德·科尔多瓦与妻子安葬于此，教堂中的纪念性图像也与他的声望有关。","与金色教堂相比，修道院的重点不是视觉上的金碧辉煌，而是古典比例、回廊节奏和从石质空间过渡到祭坛的反差。若只留30分钟，优先看回廊和主祭坛。"],["皇家礼拜堂","皇家礼拜堂与格拉纳达大教堂相邻，是斐迪南二世与伊莎贝拉一世的陵墓所在地。1492年格拉纳达纳斯里王朝的终结，是整个伊比利亚历史的转折，而这里保存着胜利一方留下的王朝记忆。","参观时先观察晚期哥特式建筑中的穹肋和高耸空间，再走向王室陵墓。看石棺上的人物服装、头饰和姿态：墓葬也是君主形象的公开宣示。","留意礼拜堂与旁边文艺复兴式大教堂的风格差异：两个相邻的空间，分别代表从晚期哥特到文艺复兴的建筑转变。","如果你今天只能选一座额外收费教堂，这里重历史叙事；圣赫罗尼莫更重回廊与建筑。两者都需独立购票。"],["纳斯瑞德宫","纳斯瑞德宫不是单一大殿，而是格拉纳达纳斯里王朝在13—15世纪逐渐营建的王宫群，今天主要包括 Mexuar、科马雷斯宫（Comares）和狮子宫（Lions）。与城外厚实的防御墙不同，宫内刻意用细密装饰和光影营造精致私密的空间。","第一段通常从 Mexuar 进入，这是处理政务、审议事务的空间。到科马雷斯宫后留意“桃金娘庭院”（Patio de los Arrayanes）：长水池像一面镜子，把建筑倒映进去；两侧深绿色桃金娘树篱给画面建立边界。水不仅用于降温，也成为构图的核心。","继续走向使节厅（Salón de Embajadores），这里位于科马雷斯塔内，象征君主的权力。抬头仔细看木质穹顶的复杂几何，再观察墙上的阿拉伯书法、植物纹样和石膏雕饰：文字不仅是信息，也是建筑表面的一部分。","进入狮子庭院（Patio de los Leones）时，观察十二只石狮支撑的喷泉、向四周延伸的细小水渠、周围纤细柱廊。建筑用水流把不同厅室联系起来，强调中心秩序。别漏掉两姐妹厅等房间的穆卡纳斯（蜂窝状）穹顶，细部像无数小空间层层叠起。","现场不必只追求拍到“空无一人”的庭院。可以分别从入口、廊下和水池对面停留，看光线如何随视角改变。你的预约为14:00；建议留75–90分钟，按单向参观路线前进。"],["卡洛斯五世宫","你会突然看到一座完全不同风格的建筑：外部近似方形，内部却围出圆形庭院。它由神圣罗马皇帝卡洛斯五世在16世纪下令兴建，体现基督教哈布斯堡王朝接管阿尔罕布拉宫后的权力表达。","走到圆形庭院中央，慢慢转一圈，观察两层柱廊的节奏。古典柱式和纯粹几何对比纳斯瑞德宫精密的阿拉伯几何纹样，风格转变非常明显。","想象原来的纳斯里宫殿旁边突然出现一座意大利文艺复兴式建筑：它告诉人们这座城从1492年以后已经属于新的统治者。","圆形庭院通常可自由进入，约15–25分钟就能看懂主要特色。内部博物馆与庭院的开放安排不同，周一尤其需要留意。"],["阿尔卡萨瓦碉堡","阿尔卡萨瓦位于阿尔罕布拉宫西端，是王室宫殿城市的军事核心。你在马拉加看过的是兼有宫苑性质的 Alcazaba；这里则更突出驻军、城墙和军事瞭望。","进入后留意地面上的军营和建筑基址：这些低矮遗址提醒人们，这里曾经有士兵生活，并非只有一座供游客登高的塔。","如果开放条件允许，可登上 Torre de la Vela（瞭望塔）。从这里朝北看阿尔拜辛老城，往西看格拉纳达市区，能直观理解为什么王朝要把防御设施建在这座山丘上。","此地主要体验是城防与全景，约30–45分钟。如果下午时间不足，可把纳斯瑞德宫和夏宫优先保留。"],["帕塔尔花园","帕塔尔区域位于阿尔罕布拉宫建筑群向东延伸的方向，连接宫殿和前往夏宫的步道。这里的看点从封闭的王宫房间转向开阔的池水、廊道和山坡。","面对池水时看建筑的倒影，再观察水、庭院、远山在同一条视线上的排列。王室庭园的美感很大程度上来自这种层层展开的空间。","这里适合放慢脚步，比起额外找一个景点“打卡”，更像从纳斯瑞德宫过渡到夏宫的自然段落。","注意地面可能湿滑，沿官方参观路径向 Generalife 方向继续。"],["夏宫","Generalife 是纳斯里王朝统治者用于休憩的宫苑，与正式王宫相比更接近山坡上的别墅和花园。这里最出名的是把建筑、农业水利与观赏性景观结合起来。","走到水渠庭院（Patio de la Acequia）时，请先沿中轴线看贯穿庭院的长水渠。流水、植物、廊道和外部山景被组织在同一个空间里。今天看到的部分喷泉与园艺布置经过后世整修，因此不要把每个细节都当成14世纪原貌。","留意水不仅“漂亮”：在安达卢西亚炎热气候下，水渠、灌溉和植物遮阴也与日常生活有关。沿台阶与平台改变角度，你会理解为什么它被选为王室的休憩处。","如果时间只够看一个重点，优先水渠庭院及其相邻的宫殿区域。你下午从纳斯瑞德宫向东移动到此处，顺路不必折返。"],["新桥","隆达的新桥（Puente Nuevo）建成于18世纪，跨越深切的塔霍峡谷，连接两侧城区。所谓“新”，是相对旧桥和较早过河路线而言，而非现代建筑。","先站在桥面感受峡谷深度，再到安全的观景台看整座桥嵌入两侧悬崖的结构。中间巨大的石拱是它最醒目的工程特征。","这座桥让隆达成为兼具地质奇观和城市工程史的地方：人们要跨越天然断裂的地形，才有今天的城市联系。","黄昏可以再看一次桥身色彩变化，但不要为寻找视角进入封闭小路或翻越护栏。"],["阿尔德韦拉","靠近隆达新桥的观景台，因视野开阔而适合看峡谷与远山。","先观察整体位置和建筑／街道的空间关系，再沿主要步行方向慢慢进入。这一站的重点是理解它在城市中的作用，而不只是拍下地标外观。","站在平台边缘的安全区域，观察城市如何建在峭壁之上。","如果时间有限，选择最有代表性的视角停留即可；可结合前后一站比较不同年代的城市风貌。"],["旧桥","连接隆达较早城区的小桥，和壮观的新桥相比尺度更小、历史氛围更浓。","先观察整体位置和建筑／街道的空间关系，再沿主要步行方向慢慢进入。这一站的重点是理解它在城市中的作用，而不只是拍下地标外观。","沿旧城路线经过即可，比较两座桥的结构与位置。","如果时间有限，选择最有代表性的视角停留即可；可结合前后一站比较不同年代的城市风貌。"],["西班牙广场","塞维利亚西班牙广场为1929年伊比利亚美洲博览会而建。半圆形建筑、运河、桥梁和瓷砖共同构成一个具有纪念性的城市舞台。","沿弧形建筑走，找代表西班牙各省的瓷砖长椅：上面常有历史场景、地图及地名。","运河和桥梁让广场兼具室外公园与展览建筑的功能。不同于马德里的传统王室广场，这里展示的是20世纪西班牙对自身和跨大西洋历史联系的想象。","免费参观，若只看重点建议30–45分钟。"],["玛丽亚路易莎公园","塞维利亚中心的大型历史公园，林荫道、喷泉和纪念性花园交织。","先观察整体位置和建筑／街道的空间关系，再沿主要步行方向慢慢进入。这一站的重点是理解它在城市中的作用，而不只是拍下地标外观。","与西班牙广场连着散步即可，适合在室外休息。","如果时间有限，选择最有代表性的视角停留即可；可结合前后一站比较不同年代的城市风貌。"],["黄金塔","瓜达尔基维尔河边的中世纪防御塔，曾守卫河港入口，如今是塞维利亚河岸地标。","先观察整体位置和建筑／街道的空间关系，再沿主要步行方向慢慢进入。这一站的重点是理解它在城市中的作用，而不只是拍下地标外观。","从河对岸或河堤看塔身轮廓；沿河继续散步。","如果时间有限，选择最有代表性的视角停留即可；可结合前后一站比较不同年代的城市风貌。"],["塞维利亚王宫","塞维利亚王宫不是一个时期建完的建筑。它经历穆斯林统治和基督教王朝的多次扩建，许多宫室体现“穆德哈尔”（Mudéjar）风格：基督教统治者继续使用安达卢西亚伊斯兰建筑工匠和装饰语言。","少女庭院（Patio de las Doncellas）最值得细看：长水池、拱廊、石膏纹样与周围宫室串联。比较它和格拉纳达纳斯瑞德宫的相似之处，也注意这里属于另一套政治与宗教环境。","使节厅（Salón de Embajadores）的穹顶格外华丽，是宫廷接见与权力展示的重要场所。抬头看木质穹顶，再注意瓷砖如何铺满墙面下部。","最后到花园放慢脚步。这里的水池与植栽不仅提供休憩，也使王宫成为典型的安达卢西亚宫苑。你的预约入口在狮子门，按票面入场窗口执行。"],["圣十字区","塞维利亚老城的小巷区域，街道曲折、白墙与橘树庭院很有安达卢西亚特色。","先观察整体位置和建筑／街道的空间关系，再沿主要步行方向慢慢进入。这一站的重点是理解它在城市中的作用，而不只是拍下地标外观。","王宫和大教堂之间走这段很顺路，注意小广场和有阴影的巷子。","如果时间有限，选择最有代表性的视角停留即可；可结合前后一站比较不同年代的城市风貌。"],["塞维利亚大教堂","这座哥特式主教座堂建在昔日大清真寺的旧址上，吉拉尔达塔（Giralda）原本是清真寺的宣礼塔，后来改作钟楼。","进入大教堂先感受高大的中殿与立柱，再看祭坛装饰。建筑宏大尺度强调了塞维利亚在中世纪后期和近代早期的地位。","若登吉拉尔达塔，可以关注其内部坡道而非通常的旋转楼梯：这是塔楼历史用途留下的特色。登顶后看老城布局与橘树庭院。","从大教堂离开后，可以在圣十字区比较不同时代的城巷、宫殿与宗教建筑如何紧密交错。"],["弗拉门戈","安达卢西亚音乐舞蹈传统结合歌唱、吉他与舞蹈，节奏与情绪表达非常鲜明。","先观察整体位置和建筑／街道的空间关系，再沿主要步行方向慢慢进入。这一站的重点是理解它在城市中的作用，而不只是拍下地标外观。","注意鞋跟击地节奏、歌者与舞者即兴呼应，以及手臂动作。","如果时间有限，选择最有代表性的视角停留即可；可结合前后一站比较不同年代的城市风貌。"],["商业广场","里斯本面向特茹河的大广场，曾是王宫所在地，1755年大地震后重建。","先观察整体位置和建筑／街道的空间关系，再沿主要步行方向慢慢进入。这一站的重点是理解它在城市中的作用，而不只是拍下地标外观。","从凯旋门望向河岸，感受广场与港口城市的关系。","如果时间有限，选择最有代表性的视角停留即可；可结合前后一站比较不同年代的城市风貌。"],["圣胡斯塔升降机","里斯本连接高低城区的铁艺升降机，19世纪末至20世纪初的城市基础设施。","先观察整体位置和建筑／街道的空间关系，再沿主要步行方向慢慢进入。这一站的重点是理解它在城市中的作用，而不只是拍下地标外观。","外观即可，观察老城坡地和机械铁构；排队很长时可不乘坐。","如果时间有限，选择最有代表性的视角停留即可；可结合前后一站比较不同年代的城市风貌。"],["佩纳宫","佩纳宫位于辛特拉山顶，是19世纪浪漫主义建筑的代表。它把不同历史风格重新组合成童话般的宫殿，因此外观有醒目的红黄立面、装饰门廊和城堡式轮廓。","抵达后先看整体轮廓，再看建筑门窗、瓷砖和雕刻：这里的“混搭”是有意识的浪漫主义设计，而不是一个朝代自然形成的传统宫堡。","室内参观留意皇室居住空间与山顶地形怎样结合；在露台上观察辛特拉山林和远处海岸方向的层层视线。","你的11:30是宫殿入口时段，不是公园大门时间。公园入口到宫殿步行约30分钟，徒步上山应额外预留体力和缓冲。"],["Santa Maria","从辛特拉历史城区一侧步行上山的公共徒步路径，林间坡道通往佩纳宫方向。","先观察整体位置和建筑／街道的空间关系，再沿主要步行方向慢慢进入。这一站的重点是理解它在城市中的作用，而不只是拍下地标外观。","沿官方标识走，预留爬升时间，注意潮湿石阶。","如果时间有限，选择最有代表性的视角停留即可；可结合前后一站比较不同年代的城市风貌。"],["Vila Sassetti","穿过辛特拉浪漫主义园林地景的下山步道，树木、石墙和园林小径相连。","先观察整体位置和建筑／街道的空间关系，再沿主要步行方向慢慢进入。这一站的重点是理解它在城市中的作用，而不只是拍下地标外观。","下山时按官方步道标志，不要只依赖地图最短路径。","如果时间有限，选择最有代表性的视角停留即可；可结合前后一站比较不同年代的城市风貌。"],["雷加莱拉","雷加莱拉庄园主要形成于19世纪末至20世纪初，建筑和园林充满象征主义元素。它不同于王室政务中心，更像一座用建筑、洞穴、井和园林讲故事的私人庄园。","最著名的启蒙井（Poço Iniciático）有螺旋楼梯向地下延伸。它常被解释为具有仪式与象征意味的空间，但具体象征含义存在不同说法，不宜把一种网络传说当作确定史实。","地下通道、洞穴与水景会让参观者不断从明亮地面进入幽暗空间，再重新走出。这种空间切换本身就是体验的一部分。","从佩纳宫徒步下山后你计划14:30入园；原票为14:00，务必以官方票面和当日入场规定为准。井道及地下路段注意湿滑。"],["圣本笃车站","圣本笃车站是波尔图著名的历史车站，最引人注目的是大厅里覆盖四壁的大型蓝白瓷砖画（azulejos）。","先在大厅中央站定，再逐墙看画面：历史战役、王室场面与葡萄牙地方生活交替出现，像一部瓷砖连环画。","蓝白配色会让人联想到葡萄牙传统瓷砖，但这里的重点不仅是装饰，而是用公共交通空间讲述国家记忆。","这里仍是运作中的火车站，拍照时留意旅客通行，不要堵住入口。"],["路易一世大桥","路易一世大桥是波尔图横跨杜罗河的双层金属拱桥，连接波尔图与维拉诺瓦德加亚。双层设计应对两岸高度差和不同交通需求。","上层适合俯瞰沿河层层叠叠的房屋以及酒窖所在的南岸，下层则更接近河岸生活。","走上层时留意金属拱架的曲线以及远处的教堂和老城轮廓。桥梁本身也是19世纪工程美学的一部分。","日落可在南岸莫罗花园停留，然后下行至河岸返回。通过桥面时遵守步行区与轨道交通分隔。"],["莫罗花园","莫罗花园位于杜罗河南岸的高处，是从加亚一侧看波尔图城市天际线的经典地点。","坐在草坡上，留意河流如何把两岸不同高度的城市联系在一起：北岸的老城屋顶、南岸的酒窖区与中间的金属桥。","日落前后光线变化很快。白天看层次，黄昏看暖色屋顶，入夜后则是桥梁和建筑的灯光。","无需门票；人多时保护随身物品，坡道和台阶可能湿滑。"],["里贝拉河岸","波尔图老城滨水区，彩色建筑依山面河，传统商业与船运历史集中于此。","先观察整体位置和建筑／街道的空间关系，再沿主要步行方向慢慢进入。这一站的重点是理解它在城市中的作用，而不只是拍下地标外观。","夜晚沿河岸走一小段，回看灯光中的金属桥。","如果时间有限，选择最有代表性的视角停留即可；可结合前后一站比较不同年代的城市风貌。"]];function guideFor(e){if(e.kind==="transfer"||/Hostel|酒店|退房|入住|巴士：|火车|Ryanair|机场|午餐|晚餐|逛街/.test(e.title))return null;const matches=guideEntries.filter(g=>e.title.includes(g[0]));if(!matches.length)return null;return matches.sort((a,b)=>b[0].length-a[0].length)[0];}const guideIllustrated={"gold": "<figure class=\"site-photo\"><img loading=\"lazy\" src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Interior_de_la_Bas%C3%ADlica_de_San_Juan_de_Dios%2C_Granada.jpg?width=900\" alt=\"金色教堂内部\" onerror=\"this.style.display='none';this.nextElementSibling.textContent='图片暂不可用；点击来源查看'\"><figcaption>金色教堂内部 · <a href=\"https://commons.wikimedia.org/wiki/File:Interior_de_la_Bas%C3%ADlica_de_San_Juan_de_Dios%2C_Granada.jpg\" target=\"_blank\" rel=\"noopener\">照片与许可来源：圣胡安德迪奥斯大教堂；Wikimedia Commons / Public domain</a></figcaption></figure><section class=\"lecture-section\"><h4>这座教堂为什么如此金碧辉煌</h4><p>这是一座18世纪西班牙巴洛克教堂，建造于1737—1759年，目的是纪念医院骑士团创始人圣若望（San Juan de Dios）。与外观相对克制的教堂相比，这里的金箔、镜面、彩色大理石和壁画在室内形成强烈的视觉冲击。装饰的作用是让人感受到宗教崇敬与圣人的荣耀。</p></section><section class=\"lecture-section\"><h4>进入后第一眼看什么</h4><p>从中央通道看主祭坛：建筑柱式、雕塑和金色背景叠在一起，形成戏剧舞台般的纵深。再抬头观察穹顶的绘画与高窗：光从高处进入，使金色表面更明亮。别只拍正面，走到两侧看看壁龛和雕像如何围绕主轴安排。</p></section><section class=\"lecture-section\"><h4>最重要的细节：Camarín</h4><p>Camarín 是安置圣若望遗物的装饰性小礼拜堂，是整座教堂的精神核心。格拉纳达市旅游局介绍这里保存着银质圣髑容器。若当日允许参观，留意祭坛后的进入路径及彩色石材、镜子与镀金装饰；若未开放则只在可参观区域观看。</p></section>", "generalife": "<figure class=\"site-photo\"><img loading=\"lazy\" src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Patio_de_la_acequia_in_Generalife%2C_Granada%2C_Spain.jpg?width=900\" alt=\"夏宫水渠庭院\" onerror=\"this.style.display='none';this.nextElementSibling.textContent='图片暂不可用；点击来源查看'\"><figcaption>夏宫水渠庭院 · <a href=\"https://commons.wikimedia.org/wiki/File:Patio_de_la_acequia_in_Generalife%2C_Granada%2C_Spain.jpg\" target=\"_blank\" rel=\"noopener\">照片与许可来源：Jebulon / CC0，Wikimedia Commons</a></figcaption></figure><section class=\"lecture-section\"><h4>夏宫和纳斯瑞德宫有什么关系</h4><p>Generalife 并非另一座独立王都，而是纳斯里王朝统治者用来休息的郊外园林空间。阿宫内部的宫殿强调王权、政务和仪式；夏宫则把水、植物、庭院与外部农田景观结合在一起。这里的“清凉”是建筑的一部分。</p></section><section class=\"lecture-section\"><h4>水渠庭院：先沿中轴线看</h4><p>Patio de la Acequia 的主角是中央水渠。水渠与庭院两侧的植物形成一条很长的视觉轴线。请注意：今天最显眼的交叉喷泉有19世纪改造的成分，不能把眼前所有水景都视为14世纪原貌。原始供水与阿尔罕布拉宫整体的山地引水系统相关。</p></section><section class=\"lecture-section\"><h4>为什么窗户开得低</h4><p>宫廷建筑里低窗让坐在室内或席地休息的人也能欣赏外面的山景、果园与城市。站在窗边尝试降低视线，再站起来比较，会更容易理解园林设计考虑的是居住者的身体姿态。</p></section><section class=\"lecture-section\"><h4>现场走法</h4><p>先看水渠庭院，再顺着步道看周边庭院与高差。把夏宫放在上午参观，之后沿帕塔尔花园向西走到14:00预约的纳斯瑞德宫，避免来回折返。</p></section>", "partal": "<section class=\"lecture-section\"><h4>这一段是园林，不只是连接通道</h4><p>帕塔尔地区包含遗存的宫殿建筑、水池与梯田式花园。最醒目的是水池旁带拱廊的建筑形象。水面倒映建筑，让结构看起来更完整，同时把景色延伸到庭院之内。</p></section><section class=\"lecture-section\"><h4>注意三个空间层次</h4><p>先看离你最近的水池与植被，然后看池边的拱廊，最后看更远处阿尔拜辛和城市景观。你会发现纳斯里宫苑不只封闭在墙内，还借用了远处的山和城作为视觉背景。</p></section>", "carlos": "<figure class=\"site-photo\"><img loading=\"lazy\" src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Patio_del_Palacio_de_Carlos_V_%28Granada%29.jpg?width=900\" alt=\"卡洛斯五世宫圆形庭院\" onerror=\"this.style.display='none';this.nextElementSibling.textContent='图片暂不可用；点击来源查看'\"><figcaption>卡洛斯五世宫圆形庭院 · <a href=\"https://commons.wikimedia.org/wiki/File:Patio_del_Palacio_de_Carlos_V_%28Granada%29.jpg\" target=\"_blank\" rel=\"noopener\">照片与许可来源：José Luis Filpo Cabana / CC BY-SA，Wikimedia Commons</a></figcaption></figure><section class=\"lecture-section\"><h4>为什么伊斯兰宫殿群里有一座意大利式宫殿</h4><p>1526年查理五世来到格拉纳达后，哈布斯堡王朝决定在阿尔罕布拉宫内建一座新的皇帝宫殿。它代表基督教帝国权力在纳斯里王朝旧宫苑旁出现，并以文艺复兴建筑语言表达新的政治秩序。</p></section><section class=\"lecture-section\"><h4>外方内圆：站在中庭中央看</h4><p>从外部看宫殿是规整的方形体量，进入后却出现巨大的圆形露天庭院。上下两层环廊的柱式、比例与连续弧线，形成非常整齐的几何秩序。你可以从边缘走到中央再回看，感受圆形庭院为什么使建筑显得庄严。</p></section><section class=\"lecture-section\"><h4>今天的参观重点</h4><p>圆形庭院约15–20分钟就能充分感受，不必执着于内部博物馆；周一博物馆常有关闭安排。记得优先为14:00纳斯瑞德宫检票留出时间。</p></section>", "nasrid": "<figure class=\"site-photo\"><img loading=\"lazy\" src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Patio_de_los_Arrayanes_Alhambra_Granada_Spain.jpg?width=900\" alt=\"桃金娘庭院\" onerror=\"this.style.display='none';this.nextElementSibling.textContent='图片暂不可用；点击来源查看'\"><figcaption>桃金娘庭院 · <a href=\"https://commons.wikimedia.org/wiki/File:Patio_de_los_Arrayanes_Alhambra_Granada_Spain.jpg\" target=\"_blank\" rel=\"noopener\">照片与许可来源：Jebulon / Wikimedia Commons</a></figcaption></figure><section class=\"lecture-section\"><h4>先理解你进入的是哪种王宫</h4><p>纳斯瑞德宫不是一座单体建筑，而是一组不同时期逐渐形成的宫殿空间，主要包括 Mexuar、科马雷斯宫和狮子宫。13至15世纪，纳斯里王朝统治格拉纳达，在基督教诸王国扩张的时代维持了安达卢斯最后一个重要穆斯林王国。宫殿既是统治中心，也是仪式与居住空间。</p></section><section class=\"lecture-section\"><h4>第一站：Mexuar 议事厅</h4><p>这里与行政、听审等活动有关。观察空间尺度、墙面瓷砖（azulejos）、灰泥雕刻以及可见的后期改造：这不是完全冻结在14世纪的房间。导览时不要只记“漂亮”，思考统治者如何用空间把普通来访者与核心宫廷分隔开。</p></section><section class=\"lecture-section\"><h4>第二站：桃金娘庭院 Patio de los Arrayanes</h4><p>长水池两侧是桃金娘绿篱，尽头立着科马雷斯塔。站在水池的一端，水面像镜子一样把立面复制出来，强化了对称感；水池不是简单的装饰，而是建筑构图的重要部分。</p></section><section class=\"lecture-section\"><h4>第三站：使节厅 Salón de Embajadores</h4><p>位于科马雷斯塔中的使节厅，是重要的王室接见空间。抬头看复杂的木质几何天花，周围墙体密布石膏纹样与阿拉伯文书法。铭文既是装饰，也是表达信仰、君权及祝愿的文字。这里的权力表现更多通过比例、节奏和精细工艺完成，而不是巨大雕像。</p></section><figure class=\"site-photo\"><img loading=\"lazy\" src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Court_of_the_Lions%2C_Alhambra_de_Granada_%28Spain%29.jpg?width=900\" alt=\"狮子庭院\" onerror=\"this.style.display='none';this.nextElementSibling.textContent='图片暂不可用；点击来源查看'\"><figcaption>狮子庭院 · <a href=\"https://commons.wikimedia.org/wiki/File:Court_of_the_Lions%2C_Alhambra_de_Granada_%28Spain%29.jpg\" target=\"_blank\" rel=\"noopener\">照片与许可来源：Heparina1985 / Wikimedia Commons</a></figcaption></figure><section class=\"lecture-section\"><h4>第四站：狮子庭院 Patio de los Leones</h4><p>中央喷泉由十二只石狮承托，四周是轻盈的柱廊。这里的空间不像科马雷斯宫那样强调一条大水池主轴，而是以中央庭院向四边房间分配动线。注意石柱密度、拱廊纹样与水如何把庭院变成一个精密的居住空间。</p></section><section class=\"lecture-section\"><h4>第五站：蜂窝状穹顶与星形光线</h4><p>在狮子宫相关厅堂留意 muqarnas（穆卡尔纳斯）装饰：它不是自然形成的蜂巢，而是由许多小型曲面单元层层组合而成。阳光经过开口投射下来时，阴影会不断变化。现场值得停留片刻，看看光线如何让静止装饰产生流动感。</p></section><section class=\"lecture-section\"><h4>参观时间</h4><p>你的入场是14:00，建议至少留75分钟。参观流线按现场开放区域推进，有些房间可能因维护暂时关闭。不要在进入下一处之前反向穿行，以免影响单向参观动线。</p></section>", "monastery": "<figure class=\"site-photo\"><img loading=\"lazy\" src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Granada_-_Monasterio_de_San_Jer%C3%B3nimo_-_interior.jpg?width=900\" alt=\"圣赫罗尼莫修道院内部\" onerror=\"this.style.display='none';this.nextElementSibling.textContent='图片暂不可用；点击来源查看'\"><figcaption>圣赫罗尼莫修道院内部 · <a href=\"https://commons.wikimedia.org/wiki/File:Granada_-_Monasterio_de_San_Jer%C3%B3nimo_-_interior.jpg\" target=\"_blank\" rel=\"noopener\">照片与许可来源：Immasureda / CC BY-SA，Wikimedia Commons</a></figcaption></figure><section class=\"lecture-section\"><h4>修道院为何出现在收复后的格拉纳达</h4><p>1492年格拉纳达纳入卡斯蒂利亚王权后，新的宗教建筑项目成为城市改造的重要部分。圣赫罗尼莫修道院在这一时期兴建，展示从哥特晚期向西班牙文艺复兴转型的建筑语言。</p></section><section class=\"lecture-section\"><h4>看祭坛与回廊</h4><p>走进教堂，关注主祭坛的高大彩绘木雕及连续叙事画面；转到回廊，看柱列、庭院和僧侣生活的空间秩序。这里与金色教堂相隔几分钟，却能看到不同年代与宗教审美的对比。</p></section>"};function illustrationFor(e){const t=e.title||"";if(t.includes("金色教堂"))return guideIllustrated.gold;if(t.includes("夏宫")&&t.includes("Generalife"))return guideIllustrated.generalife;if(t.includes("帕塔尔花园"))return guideIllustrated.partal;if(t.includes("卡洛斯五世宫"))return guideIllustrated.carlos;if(t.includes("纳斯瑞德宫")&&!t.includes("入口"))return guideIllustrated.nasrid;if(t.includes("圣赫罗尼莫"))return guideIllustrated.monastery;return "";}const daynames={"2026-11-06": "马拉加 Málaga", "2026-11-07": "马拉加 Málaga", "2026-11-08": "马拉加 → 格拉纳达", "2026-11-09": "格拉纳达 Granada", "2026-11-10": "格拉纳达 → 隆达", "2026-11-11": "隆达 → 塞维利亚", "2026-11-12": "塞维利亚 Sevilla", "2026-11-13": "塞维利亚 → 里斯本", "2026-11-14": "辛特拉 Sintra", "2026-11-15": "里斯本 → 波尔图", "2026-11-16": "波尔图 → 梅明根"};let chosen='all',filter='all';const dates=Object.keys(daynames);const weekday=['日','一','二','三','四','五','六'];function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function maps(s){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s)}function direction(a,b){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a)+'&destination='+encodeURIComponent(b)+'&travelmode=transit'}const routeHints={"2026-11-06":"从 Coeo Hostel 放好行李后开始老城步行。","2026-11-07":"从 Coeo Hostel 出发，先上山，随后逐渐下行；晚间自行回酒店。","2026-11-08":"从 Black Swan 出发，经过大教堂、达罗河步道、阿尔拜辛，最后到圣尼古拉斯观景台看日落。","2026-11-09":"从 Black Swan 出发，先参观金色教堂、夏宫与花园，14:00进入纳斯瑞德宫，参观后直接去圣奥古斯丁市场。","2026-11-10":"从 Ronda 火车站先到 Hotel Molino；行李问题解决后再去新桥。","2026-11-11":"从 Hotel Molino 退房前往 Ronda 汽车站；到塞维利亚后先到 Sweet Sevilla 放行李。","2026-11-12":"从 Sweet Sevilla Hostel 出发，按王宫→圣十字区→大教堂→弗拉门戈顺路走。","2026-11-13":"从 Lisboa Oriente 先到 Boavista 83 放行李，再去商业广场和观景台，晚间返回酒店。","2026-11-14":"从 Boavista 83 到 Rossio 乘火车；辛特拉两条步道按现场官方标识走，返程回 Boavista 83。","2026-11-15":"从 Boavista 83 前往 Lisboa Oriente；抵达 Porto Campanhã 后先到 Being Porto 放行李，再走桥梁环线。","2026-11-16":"从 Being Porto Hostel 04:00 Uber 预约出发前往 OPO 机场。"};const routeAnchors={"2026-11-06":["Coeo Hernan Ruiz Rooftop Pool Hostel, Malaga","Coeo Hernan Ruiz Rooftop Pool Hostel, Malaga","酒店 → 老城 → 港口 → 酒店"],"2026-11-07":["Coeo Hernan Ruiz Rooftop Pool Hostel, Malaga","Coeo Hernan Ruiz Rooftop Pool Hostel, Malaga","酒店 → 城堡山 → 下山 → 老城 → 海滨 → 酒店"],"2026-11-08":["Black Swan Hostel Granada, Granada","Black Swan Hostel Granada, Granada","酒店 → 大教堂 → 达罗河 → 阿尔拜辛 → 圣尼古拉斯 → 酒店"],"2026-11-09":["Black Swan Hostel Granada, Granada","Black Swan Hostel Granada, Granada","酒店 → 金色教堂 → 夏宫 → 帕塔尔花园 → 纳斯瑞德宫 → 圣奥古斯丁市场 → 酒店"],"2026-11-10":["Hotel Molino, Ronda","Hotel Molino, Ronda","火车站 → 酒店确认行李 → 新桥及观景点 → 酒店"],"2026-11-11":["Sweet Sevilla Hostel, Seville","Sweet Sevilla Hostel, Seville","巴士抵达 → 酒店放行李 → 西班牙广场 → 河岸 → 酒店"],"2026-11-12":["Sweet Sevilla Hostel, Seville","Sweet Sevilla Hostel, Seville","酒店 → 王宫 → 大教堂 → 弗拉门戈 → 酒店"],"2026-11-13":["Boavista 83 Hostel, Rua da Boavista 83, Lisbon","Boavista 83 Hostel, Rua da Boavista 83, Lisbon","Oriente 抵达 → 酒店放行李 → 商业广场 → 观景台 → 酒店"],"2026-11-14":["Sintra Railway Station, Portugal","Sintra Railway Station, Portugal","酒店 → Rossio 火车 → 辛特拉徒步 → 火车返回酒店"],"2026-11-15":["Being Porto Hostel, Rua de Belomonte 13, Porto","Being Porto Hostel, Rua de Belomonte 13, Porto","火车到 Campanhã → 酒店放行李 → 过桥看日落 → 酒店"],"2026-11-16":["Being Porto Hostel, Rua de Belomonte 13, Porto","Porto Airport, Portugal","酒店 → Uber → 波尔图机场"]};function routeBar(d,items){const info=routeAnchors[d];if(!info)return '';let text=routeHints[d]||'';let walk=items.filter(e=>e.place&&(e.kind==='free'||e.kind==='ticket'||(d==='2026-11-08'&&e.kind==='optional')||(e.kind==='booked'&&/宫|Cathedral|Alcázar|Flamenco|弗拉门戈|雷加莱拉/.test(e.title))));let p=[info[0],...walk.map(e=>e.place),info[1]];if(d==='2026-11-14'){p=[];}let u='';if(p.length>=2){const stop=p.slice(1,-1).slice(0,7);u='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(p[0])+'&destination='+encodeURIComponent(p[p.length-1])+'&travelmode=walking';if(stop.length)u+='&waypoints='+encodeURIComponent(stop.join('|'));}let extra=d==='2026-11-14'?'Santa Maria 上山，Vila Sassetti 下山。按步道指示牌行走。':'';return '<div class="routebar"><strong>🧭 起终点：'+escapeHTML(info[2])+'</strong><small>'+escapeHTML(text)+'</small>'+(u?'<a href="'+escapeHTML(u)+'" target="_blank" rel="noopener">📍 从酒店串联步行景点（Google Maps）</a>':'')+'<small>'+escapeHTML(extra)+'</small></div>'}function render(){document.getElementById('days').innerHTML='<button data-day="all" class="'+(chosen==='all'?'active':'')+'">全部日期</button>'+dates.map(d=>`<button data-day="${d}" class="${chosen===d?'active':''}">${d.slice(8)}日</button>`).join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{chosen=b.dataset.day;render();window.scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));document.getElementById('content').innerHTML=dates.filter(d=>chosen==='all'||chosen===d).map(d=>{let items=events[d].filter(e=>filter==='all'||(filter==='confirmed'&&e.status==='confirmed')||(filter==='free'&&e.kind==='free')||(filter==='transfer'&&e.kind==='transfer'));if(!items.length)return '';let date=new Date(d+'T12:00:00');return `<section class="day"><div class="day-head"><div><h2>${Number(d.slice(5,7))}月${Number(d.slice(8))}日 · 周${weekday[date.getDay()]}</h2><p>${daynames[d]}</p></div><span style="color:#8696a9;font-size:12px">${items.length}项</span></div>${routeBar(d,items)}<div class="timeline">${items.map(e=>`<div class="entry ${e.kind}"><div class="clock">${escapeHTML(e.time)}${e.end?`<div style="font-size:11px;font-weight:400;color:#7b8da1">至 ${escapeHTML(e.end)}</div>`:''}</div><div class="spine"></div><article class="card"><div class="meta"><span>${({free:'免费景点',transfer:'交通／购票',ticket:'已购门票',booked:'已确认预订',optional:'可选项目'})[e.kind]||'活动'}</span><span class="pill">${e.status==='confirmed'?'预订确认':e.kind==='free'?'无需预订':e.kind==='optional'?'尚未购买':'建议时间'}</span></div><h3>${escapeHTML(e.title)}</h3><p>${escapeHTML(e.desc)}</p>${e.rule?`<div class="rule">🕒 ${escapeHTML(e.rule)}</div>`:''}${e.note?`<div class="note">⚑ ${escapeHTML(e.note)}</div>`:''}${illustrationFor(e)?`<details class="guide visual-guide"><summary>📖 图文现场讲解 · 按参观顺序阅读</summary><div>${illustrationFor(e)}</div></details>`:``}${!illustrationFor(e)&&guideFor(e)?`<details class="guide"><summary>🎧 现场讲解 · 历史与看点</summary><div><strong>① 历史背景</strong><p>${escapeHTML(guideFor(e)[1])}</p><strong>② 按顺序看</strong><p>${escapeHTML(guideFor(e)[2])}</p><strong>③ 细节与意义</strong><p>${escapeHTML(guideFor(e)[3])}</p><strong>④ 现场提示</strong><p>${escapeHTML(guideFor(e)[4])}</p>${guideFor(e)[5]?`<strong>⑤ 最值得停留</strong><p>${escapeHTML(guideFor(e)[5])}</p>`:''}</div></details>`:``}<div class="links">${e.place?`<a target="_blank" rel="noopener" href="${escapeHTML(maps(e.place))}">📍 Google Maps</a>`:''}${e.dest?`<a target="_blank" rel="noopener" href="${escapeHTML(direction(e.place,e.dest))}">🧭 路线</a>`:''}${e.website?`<a target="_blank" rel="noopener" href="${escapeHTML(e.website)}">🔗 官网／购票</a>`:''}${e.link?`<a class="ticket" target="_blank" rel="noopener" href="${escapeHTML(e.link)}">🎫 查看票据</a>`:''}</div>${e.link?`<div class="filename">${escapeHTML(decodeURIComponent(e.link.split('/').pop()))}</div>`:''}</article></div>`).join('')}</div></section>`}).join('')||'<div class="info">此日期没有匹配的活动。</div>'}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});render();
